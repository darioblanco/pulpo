[package]
name = "pulpo-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "End-to-end scenario suite: real pulpod + real tmux + a fake harness"
publish = false

[lib]
name = "pulpo_e2e"
path = "src/lib.rs"

# Fake harness binaries imitating a coding agent CLI's surface (Claude Code, Codex,
# pi). Dev-only tooling for the scenario suite below — never part of a release build
# (no `[package.metadata.dist]` entry, and `publish = false` above keeps it out of
# any published/release artifact).
[[bin]]
name = "fake-claude"
path = "src/bin/fake-claude.rs"

[[bin]]
name = "fake-codex"
path = "src/bin/fake-codex.rs"

[[bin]]
name = "fake-pi"
path = "src/bin/fake-pi.rs"

[dependencies]
# Path-only: this crate is never published, so no version pin (a pin here is not
# bumped by release-please and broke the 0.3.0 release PR).
pulpo-common = { path = "../pulpo-common" }
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
toml.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
tempfile = "3"

[lints]
workspace = true
